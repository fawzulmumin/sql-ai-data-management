<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
          <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
          <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
        </svg>
      </div>
      <h1>SQL AI Agent</h1>
      <p>Silakan login untuk menggunakan SQL AI Agent</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      @if (errorMessage()) {
        <div class="login-error" [class.blocked-error]="isBlocked()" role="alert">
          @if (isBlocked()) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px; flex-shrink: 0;">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          }
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" type="text" [ngModel]="username()" (ngModelChange)="username.set($event)" name="username" placeholder="Masukkan username" autocomplete="username" [disabled]="isLoading() || isBlocked()" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-input-wrapper">
          <input id="password" [type]="showPassword() ? 'text' : 'password'" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" placeholder="Masukkan password" autocomplete="current-password" [disabled]="isLoading() || isBlocked()"/>
          <button type="button" class="toggle-password-btn" (click)="showPassword.set(!showPassword())" [disabled]="isLoading() || isBlocked()" tabindex="-1">
            @if (showPassword()) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            } 
            @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            }
          </button>
        </div>
      </div>

      <button type="submit" [disabled]="isLoading() || isBlocked()" class="login-btn">
        {{ isLoading() ? 'Memproses...' : (isBlocked() ? 'Terkunci Sementara' : 'Login') }}
      </button>
    </form>

    <div class="login-footer">
        <small>Hubungi DB Owner untuk mendapatkan akun</small>
    </div>
  </div>
</div>
